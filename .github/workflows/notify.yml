name: Preview or send radar digest
"on":
  workflow_dispatch:
    inputs:
      date:
        description: Public edition date (YYYY-MM-DD)
        required: true
        type: string
      send:
        description: Send to the owner-configured Teams group chat (otherwise preview only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: notify-${{ inputs.date }}
  cancel-in-progress: false
jobs:
  digest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RADAR_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Create public-only Adaptive Card preview
        run: python -m radar.notifications --date "$RADAR_DATE" --output work/teams-payload.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teams-card-preview
          path: work/teams-payload.json
          retention-days: 7
      - name: Send to configured group chat
        if: inputs.send
        env:
          RADAR_TEAMS_WEBHOOK: ${{ secrets.RADAR_TEAMS_WEBHOOK }}
        run: python -m radar.notifications --date "$RADAR_DATE" --send --destination-env RADAR_TEAMS_WEBHOOK
