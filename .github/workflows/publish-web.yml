name: Build and publish public web
"on":
  push:
    branches: [main]
    paths: ["data/**", "config/**", "radar/**", "schemas/**", "web/**", "tests/**", "requirements.lock", ".github/workflows/publish-web.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -v
      - run: python -m radar validate
      - run: python -m radar rollup --check
      - name: Build explicit public projection
        run: python -m radar.site --output dist
      - name: Verify export allowlist, links and checksums
        run: python web/check_site.py dist
      - name: Retain reviewable public artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Upload verified site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
